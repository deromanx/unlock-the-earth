name: Update Episodes from RSS

# 每天抓 RSS：新集數上架後，本機先 commit 的地標（scripts/add_episode.sh）會在這裡併進地球
on:
  schedule:
    - cron: '0 2 * * *'   # 每天 10:00 台灣時間
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Fetch RSS → episodes.json
        run: python scripts/fetch_rss.py

      - name: Rebuild landmarks（新集數上架後併進地標總表；簡轉繁已在本機做過）
        shell: bash -eo pipefail {0}
        run: |
          python scripts/pipeline/04_build_landmarks.py --no-convert | grep -E "Total landmarks|Written"
          python scripts/pipeline/05_wikipedia_info.py | tail -2

      - name: Build per-episode share pages
        run: python scripts/build_ep_pages.py

      # GitHub 的 ubuntu-latest 映像檔已不再內建 ffmpeg（2026-10-28 起封面縮圖因此失敗），自己裝
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Cover colors, thumbnails, latest-episode waveform
        run: |
          python scripts/build_episode_colors.py
          python scripts/build_cover_thumbs.py
          python scripts/build_waveform.py

      - name: Stamp data version
        run: python scripts/stamp_data_version.py

      - name: Check site data（出錯就讓這次 workflow 失敗）
        run: python scripts/check_site_data.py

      - name: Commit if changed
        shell: bash -eo pipefail {0}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ ep/ assets/covers/ index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update episodes from RSS"
            git pull --rebase
            git push
          fi
