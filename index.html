<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>解鎖地球 — 互動旅遊地球儀</title>
  <meta name="description" content="解鎖地球 Podcast：旅行、歷史、文化。轉動地球，探索每一集去過的地方。">
  <meta name="theme-color" content="#060b18">
  <meta name="data-version" content="9402b989c6">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="解鎖地球">
  <meta property="og:title" content="解鎖地球 — 互動旅遊地球儀">
  <meta property="og:description" content="轉動地球，探索《解鎖地球》每一集去過的地方：近 2,000 個地標、130 多個國家。">
  <meta property="og:image" content="https://deromanx.github.io/unlock-the-earth/assets/banner-2400.jpg">
  <meta property="og:url" content="https://deromanx.github.io/unlock-the-earth/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="assets/logo-256.png">
  <link rel="apple-touch-icon" href="assets/logo-256.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
  <link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js">
  <link rel="stylesheet" href="css/globe.css?v=12">
  <script>
    // 先套主題，避免載入時閃一下深色
    try { document.documentElement.dataset.theme = localStorage.getItem('ute-theme-v2') || 'dark'; } catch (e) {}
  </script>
</head>
<body class="intro">

  <!-- ── 地球 ── -->
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="wave" aria-hidden="true"></canvas>
  <div id="globe" aria-label="互動地球儀"></div>

  <!-- ── 頂部列 ── -->
  <header id="topbar">
    <button class="brand" id="brand" title="回到起點">
      <img src="assets/logo-256.png" alt="" class="brand-logo">
      <span class="brand-text">
        <span class="brand-title">解鎖地球</span>
        <span class="brand-sub">旅行 · 歷史 · 文化</span>
      </span>
    </button>

    <nav class="toolbar" aria-label="功能">
      <button class="tool tool-primary" id="btn-random" title="隨機出發">
        <span class="tool-ico" data-icon="dice"></span><span class="tool-label">隨機出發</span>
      </button>
      <button class="tool" id="btn-episodes" title="所有集數">
        <span class="tool-ico" data-icon="headphones"></span><span class="tool-label">集數</span>
      </button>
      <button class="tool" id="btn-timeline" title="時間線">
        <span class="tool-ico" data-icon="history"></span><span class="tool-label">時間線</span>
      </button>
      <button class="tool" id="btn-visited" title="標記我去過的國家">
        <span class="tool-ico" data-icon="plane"></span><span class="tool-label">我的足跡</span>
      </button>
      <button class="tool" id="btn-mosaic" title="封面地圖：每一集的封面擺在它去的地方">
        <span class="tool-ico" data-icon="grid"></span><span class="tool-label">封面地圖</span>
      </button>
      <button class="tool" id="btn-stats" title="節目統計">
        <span class="tool-ico" data-icon="chart"></span><span class="tool-label">統計</span>
      </button>
      <button class="tool tool-icon" id="btn-theme" aria-label="切換深淺色" title="切換深淺色">
        <span class="tool-ico" id="theme-ico"></span>
      </button>
    </nav>
  </header>

  <!-- ── 開場 ── -->
  <section id="hero">
    <p class="hero-kicker">PODCAST · 互動地球儀</p>
    <h1 class="hero-title" aria-label="用耳朵走遍世界"><span class="ttl" style="--ar:1.46;-webkit-mask-image:url(assets/titles/hero-1.svg);mask-image:url(assets/titles/hero-1.svg)" aria-hidden="true"></span><br><span class="ttl" style="--ar:1.96;-webkit-mask-image:url(assets/titles/hero-2.svg);mask-image:url(assets/titles/hero-2.svg)" aria-hidden="true"></span></h1>
    <div class="hero-stats">
      <div class="hero-stat"><b id="hs-eps">0</b><span>集節目</span></div>
      <div class="hero-stat"><b id="hs-lms">0</b><span>個地標</span></div>
      <div class="hero-stat"><b id="hs-cty">0</b><span>個國家</span></div>
    </div>
    <div class="hero-actions">
      <button class="btn btn-primary" id="hero-random"><span data-icon="dice"></span>隨機出發</button>
      <button class="btn btn-ghost" id="hero-browse">瀏覽集數</button>
    </div>
    <button class="hero-latest" id="hero-latest" hidden></button>
    <p class="hero-hint">拖曳轉動地球 · 點光點看地標 · 點國家看專頁</p>
    <p class="hero-wave-note" id="hero-wave-note" hidden></p>
    <p class="hero-loading" aria-live="polite">地球載入中…</p>
  </section>

  <!-- ── 圖例 ── -->
  <div id="legend" aria-label="國家顏色圖例">
    <span class="legend-title">節目去過幾集</span>
    <span class="legend-bar" id="legend-bar"></span>
    <span class="legend-scale"><span>1</span><span id="legend-mid"></span><span id="legend-max"></span></span>
    <span class="legend-home" id="legend-home"></span>
  </div>

  <!-- ── 集數抽屜 ── -->
  <aside id="drawer" class="sheet sheet-left" aria-label="集數列表">
    <div class="sheet-head">
      <h2 class="sheet-title">所有集數 <span class="sheet-count" id="ep-count"></span></h2>
      <button class="icon-btn" data-close="drawer" aria-label="關閉">✕</button>
    </div>
    <div class="search-box">
      <span class="search-ico" aria-hidden="true">⌕</span>
      <input type="search" id="search" placeholder="搜尋集數、地標或國家…" autocomplete="off">
    </div>
    <div class="pills" id="region-pills"></div>
    <div class="pills pills-scroll" id="tag-pills"></div>
    <div class="pills pills-scroll" id="year-pills"></div>
    <div class="ep-list" id="ep-list"></div>
  </aside>

  <!-- ── 詳情面板（地標／集數／國家／足跡）── -->
  <aside id="detail" class="sheet sheet-right" aria-live="polite">
    <button class="icon-btn detail-close" data-close="detail" aria-label="關閉">✕</button>
    <div id="detail-body"></div>
  </aside>

  <!-- ── 導覽模式 ── -->
  <section id="story" aria-live="polite">
    <div class="story-progress" id="story-progress"></div>
    <div class="story-card">
      <div class="story-img" id="story-img"></div>
      <div class="story-text">
        <div class="story-meta" id="story-meta"></div>
        <h3 class="story-name" id="story-name"></h3>
        <blockquote class="story-quote" id="story-quote"></blockquote>
        <p class="story-context" id="story-context"></p>
      </div>
    </div>
    <div class="story-controls">
      <button class="icon-btn" id="story-prev" aria-label="上一站">◀</button>
      <button class="icon-btn story-play" id="story-play" aria-label="暫停">❚❚</button>
      <button class="icon-btn" id="story-next" aria-label="下一站">▶</button>
      <a class="btn btn-small btn-primary" id="story-listen" target="_blank" rel="noopener">收聽這集</a>
      <button class="btn btn-small btn-ghost" id="story-exit">結束導覽</button>
    </div>
  </section>

  <!-- ── 時間線 ── -->
  <section id="timeline">
    <div class="tl-top">
      <div class="tl-date" id="tl-date">—</div>
      <div class="tl-counts"><b id="tl-lms">0</b> 地標 · <b id="tl-cty">0</b> 國</div>
      <button class="icon-btn" id="tl-exit" aria-label="結束時間線">✕</button>
    </div>
    <div class="tl-ep" id="tl-ep"></div>
    <div class="tl-trails" id="tl-trails" hidden>
      <span><b>七年光軌</b><em id="tl-trails-text"></em></span>
      <button class="btn btn-primary" id="tl-trails-card"><span data-icon="image"></span>存成圖卡</button>
    </div>
    <div class="tl-row">
      <button class="icon-btn tl-play" id="tl-play" aria-label="播放">▶</button>
      <div class="tl-track">
        <input type="range" id="tl-slider" step="86400000" aria-label="時間">
        <div class="tl-years" id="tl-years"></div>
      </div>
    </div>
  </section>

  <!-- ── 足跡結果 ── -->
  <div id="visited-overlay" class="modal">
    <div class="modal-card visited-card">
      <div class="visited-illu" id="v-illu"></div>
      <div class="visited-title" id="v-title"></div>
      <div class="visited-sub" id="v-sub"></div>
      <div class="visited-pct" id="v-pct">0%</div>
      <div class="visited-pct-label">解鎖地球</div>
      <div class="visited-count" id="v-count"></div>
      <div class="visited-chips" id="v-chips"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="v-card"><span data-icon="image"></span>產生分享圖卡</button>
        <button class="btn btn-ghost" id="v-share"><span data-icon="link"></span>複製連結</button>
        <button class="btn btn-ghost" data-close="visited-overlay">繼續標記</button>
      </div>
    </div>
  </div>

  <!-- ── 統計 ── -->
  <div id="stats-modal" class="modal">
    <div class="modal-card stats-card">
      <div class="modal-head">
        <h2>節目統計</h2>
        <button class="icon-btn" data-close="stats-modal" aria-label="關閉">✕</button>
      </div>
      <div id="stats-body"></div>
    </div>
  </div>

  <!-- ── 分享圖卡 ── -->
  <div id="share-modal" class="modal">
    <div class="modal-card share-card">
      <div class="modal-head">
        <h2>分享圖卡</h2>
        <button class="icon-btn" data-close="share-modal" aria-label="關閉">✕</button>
      </div>
      <div class="share-stage"><img id="share-preview" alt="分享圖卡預覽"></div>
      <p class="share-hint">1080 × 1920，適合 IG／FB 限時動態</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="share-native" hidden><span data-icon="share"></span>分享</button>
        <button class="btn btn-primary" id="share-download"><span data-icon="download"></span>下載圖片</button>
        <button class="btn btn-ghost" id="share-copy"><span data-icon="link"></span>複製連結</button>
      </div>
    </div>
  </div>

  <!-- ── 封面地圖 ── -->
  <div id="mosaic-modal" class="modal">
    <div class="modal-card mosaic-card">
      <div class="modal-head">
        <h2>封面地圖 <small id="mosaic-count"></small></h2>
        <button class="icon-btn" data-close="mosaic-modal" aria-label="關閉">✕</button>
      </div>
      <p class="mosaic-caption" id="mosaic-caption">把滑鼠移到封面上看是哪一集，點下去就飛過去</p>
      <div class="mosaic-scroll">
        <div class="mosaic-map" id="mosaic-map"><canvas id="mosaic-land" aria-hidden="true"></canvas></div>
      </div>
    </div>
  </div>

  <!-- ── 降落轉場 ── -->
  <div id="landing" aria-hidden="true"><span></span></div>

  <div id="tooltip" role="tooltip"></div>
  <div id="toast"></div>
  <div id="spin-veil"><span>🎲 命運的骰子轉動中…</span></div>

  <div id="loading">
    <img src="assets/logo-256.png" alt="">
    <p>正在解鎖地球…</p>
  </div>

  <noscript><p class="fallback">本網站需要 JavaScript 才能顯示互動地球。</p></noscript>

  <script src="js/globe/data.js?v=3"></script>
  <script src="js/globe/visuals.js?v=2"></script>
  <script src="js/globe/app.js?v=22"></script>
  <script src="js/globe/share.js?v=7"></script>
</body>
</html>
